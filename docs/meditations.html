c":"Retreat","title":"The good is found within, by digging again and again","summary":"“Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig.” Not yet carded: a candidate for an accumulation path, but the text gives no stages to draw.","source":{"locator":"Book VII, 59","url":"https://www.gutenberg.org/ebooks/15877"}},{"number":6,"topic":"Obstacles","title":"Expect difficult people before the day begins","summary":"The morning rehearsal of meeting “the busybody, the ungrateful, arrogant…” and why they cannot injure you. Not yet carded: the argument rests on kinship and reason, which needs more than one diagram.","source":{"locator":"Book II, 1","url":"https://www.gutenberg.org/ebooks/15877"}}],"cards":[{"number":1,"topic":"Judgment","title":["Pain passes through a judgment,","and that judgment is yours"],"summary":"Marcus separates the external thing from the opinion we form about it and locates the disturbance in the opinion. Because the judgment is ours, it is “in thy power to wipe out this judgment now.” The same section adds a limit: when an obstacle is truly beyond us, “the cause of its not being done depends not on thee.”","diagram_alt":"Left of a dashed divider, the event; right of it, a green box for your judgment followed by disturbance. A green arrow rises from the you circle to the judgment box: you can wipe it out now.","diagram_svg":"\u003ctext x=\"85\" y=\"34\" text-anchor=\"middle\" class=\"sm\"\u003eoutside you\u003c/text\u003e\n\u003ctext x=\"380\" y=\"34\" text-anchor=\"middle\" class=\"sm\"\u003einside you\u003c/text\u003e\n\u003cline x1=\"172\" y1=\"16\" x2=\"172\" y2=\"212\" class=\"grey-stroke dash\" stroke-width=\"1.2\"/\u003e\n\u003crect x=\"22\" y=\"88\" width=\"126\" height=\"44\" rx=\"10\" class=\"grey-stroke-strong\" stroke-width=\"1.5\" fill=\"none\"/\u003e\n\u003ctext x=\"85\" y=\"115\" text-anchor=\"middle\" class=\"mid\"\u003ethe event\u003c/text\u003e\n\u003cline x1=\"152\" y1=\"110\" x2=\"20 nd mountains; and thou too art wont to desire such things very much. But this is altogether a mark of the most common sort of men, for it is in thy power whenever thou shalt choose to retire into thyself.","original":""},"source":{"locator":"Book IV, 3 (tr. Long)","url":"https://www.gutenberg.org/ebooks/15877"}},{"number":3,"topic":"Obstacles","title":["The mind turns a hindrance","into a help on the road"],"summary":"Other people can impede what Marcus does, but not his “affects and disposition”, which act conditionally and adapt. The claim is narrow: an obstacle may stop a particular act; it cannot stop the disposition from using the obstacle as material for the next one.","diagram_alt":"A gray road from you runs into a gray block labelled hindrance and stops. A dotted green path climbs onto the block, uses it as a step and continues up to an aid, a furtherance.","diagram_svg":"\u003cline x1=\"62\" y1=\"170\" x2=\"226\" y2=\"170\" class=\"grey-stroke-strong\" stroke-width=\"2.4\"/\u003e\n\u003ccircle cx=\"42\" cy=\"170\" r=\"19\" class=\"you\"/\u003e\n\u003ctext x=\"42\" y=\"174.5\" text-anchor=\"middle\" class=\"you-tx\"\u003eyou\u003c/text\u003e\n\u003crect x=\"228\" y=\"122\" width=\"62\" height=\"48\" rx=\"4\" class=\"grey-shape\"/\u003e\n\u003ctext x=\"259\" y=\"192\" text-anchor=\"middle\" class=\"sm\"\u003ehindrance\u003c/text\u003e\n\u003ctext x=\"150\" y=\"192\" text-anchor=\"middle\" class=\"tiny\"\u003ethe act is impeded\u003c/text\u003e\n\u003cpath d=\"M 56 156 C 120 150 150 130 200 128 C 220 127 226 118 236 116 L 284 116 C 340 112 400 76 470 58\" class=\"green-stroke dash\" stroke-width=\"2.2\" fill=\"none\"/\u003e\n\u003cpolygon points=\"484.0,54.0 478.4,60.0 476.1,51.6\" class=\"green-fill\"/\u003e\n\u003ccircle cx=\"132\" cy=\"144\" r=\"3.5\" class=\"green-fill\"/\u003e\u003ccircle cx=\"260\" cy=\"116\" r=\"3.5\" class=\"green-fill\"/\u003e\u003ccircle cx=\"380\" cy=\"88\" r=\"3.5\" class=\"green-fill\"/\u003e\n\u003ctext x=\"380\" y=\"118\" class= ator":"Book VIII, 16 (tr. Long)","url":"https://www.gutenberg.org/ebooks/15877"},"interpretation_note":"The filter comes from Book IV, 12; putting the two sections together is the editor’s choice."}]};

const T = I18N[LANG];
const E = s => String(s ?? '').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pad = x => String(x).padStart(2, '0');
const $ = id => document.getElementById(id);
const outlineEntries = data.outline_entries || notes.map(n=>({number:n.number,topic:n.topic,title:n.title.join(LANG==='en'?' ':''),summary:n.summary,source:n.source}));
const cardById = new Map(notes.map(n=>[n.number,n]));

document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';

$('filters').innerHTML = [T.all, ...Object.keys(themeIntros)].map((tag, i)=>`<button type="button" class="filter" data-filter="${i===0 ? '*' : E(tag)}" aria-pressed="${i===0}">${E(tag)}</button>`).join('');

// Show only the legend entries this deck actually uses.
const allSvg = notes.map(n => n.diagram_svg).join('\n');
const hasClass = (...names) => [...allSvg.matchAll(/class="([^"]*)"/g)].some(m => names.every(nm => m[1].split(/\s+/).includes(nm)));
const usage = {
  grey: hasClass('grey-shape'),
  unique: /href="#ng-unique"/.test(allSvg),
  explore: hasClass('green-stroke', 'dash'),
  you: hasClass('you'),
  wash: hasClass('wash-fill'),
  divider: hasClass('grey-stroke', 'dash')
};
let legendCount = 0;
document.querySelectorAll('.legend-item').forEach(el => { el.hidden = !usage[el.dataset.needs]; if (!el.hidden) legendCount++; });
$('legend').hidden = legendCount === 0;

const quoteParts = q => {
  const verbatimMain = q.kind === 'quote';
  const verbatimOrig = q.kind === 'quote' || q.kind === 'quote_translation';
  return {
    label: T.kinds[q.kind],
    main: verbatimMain ? T.lq + q.text + T.rq : q.text,
    orig: q.original ? (verbatimOrig ? '“' + q.original + '”' : q.original) : ''
  };
};
const makeQuote = n => {
  const p = quoteParts(n.quote);
  return `<div class="quote"><div class="quote-label">${E(p.label)}</div><p class="quote-main">${E(p.main)}</p>${p.orig ? `<p class="quote-orig">${E(p.orig)}</p>` : ''}</div>`;
};
const sourceLink = n => n.source.url ? `<a href="${E(n.source.url)}" target="_blank" rel="noopener noreferrer" aria-label="${E(T.aria.check(n.number))}">${E(T.check)}</a>` : '';
$('cards').innerHTML = notes.map(n=>`<article class="note-card" data-tag="${E(n.topic)}" id="note-${pad(n.number)}">
  <div class="card-top"><span class="card-number">#${pad(n.number)}</span><span class="card-book">${E(T.book(book.title))}</span><span class="card-tag">${E(n.topic)}</span></div>
  <h2 class="card-title"><span>${E(n.title[0])}</span><span>${E(n.title[1])}</span></h2>
  <div class="diagram-box"><svg class="diagram" viewBox="0 0 560 228" role="img" aria-label="${E(n.diagram_alt)}">${n.diagram_svg}</svg></div>
  ${makeQuote(n)}
  ${n.interpretation_note ? `<p class="card-note">${E(T.note)}${E(n.interpretation_note)}</p>` : ''}
  <div class="source"><span class="source-chapter" title="${E(n.source.locator)}">SOURCE · ${E(n.source.locator)}</span><span class="source-actions">${sourceLink(n)}<button type="button" class="save-btn" data-save="${n.number}" aria-label="${E(T.aria.save(n.number))}">${E(T.save)}</button></span></div>
</article>`).join('');
$('outline').innerHTML = Object.keys(themeIntros).map(tag=>`<section class="outline-group" data-tag="${E(tag)}"><h2 class="outline-group-title">${E(tag)}${E(T.outlineSuffix)}</h2><p class="outline-group-intro">${E(themeIntros[tag])}</p>${outlineEntries.filter(n=>n.topic===tag).map(n=>{
  const saved = cardById.has(n.number);
  const source = n.source || {};
  const title = Array.isArray(n.title) ? n.title.join(LANG==='en'?' ':'') : n.title;
  return `<article class="outline-row"><div class="outline-num">#${pad(n.number)}</div><div><h3 class="outline-title">${E(title)}</h3><p class="outline-sum">${E(n.summary)}</p><div class="outline-ref"><b>${E(saved ? T.done : T.todo)}</b> ${E(source.locator || '')} ${source.url ? `· <a href="${E(source.url)}" target="_blank" rel="noopener noreferrer">${E(T.check)}</a>` : ''} ${saved ? `· <a href="#note-${pad(n.number)}" class="go-card" data-id="${n.number}">${E(T.goCard)}</a>` : ''}</div></div></article>`;
}).join('')}</section>`).join('');

let currentFilter = '*', isOutline = false;
function render() {
  const visible = currentFilter === '*' ? notes.length : notes.filter(n=>n.topic===currentFilter).length;
  $('card-count').textContent = `${pad(visible)} / ${pad(notes.length)}`;
  document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.filter===currentFilter)));
  document.querySelectorAll('.note-card,.outline-group').forEach(el=>el.hidden = currentFilter!=='*' && el.dataset.tag!==currentFilter);
  $('cards').hidden = isOutline;
  $('outline').hidden = !isOutline;
  $('view-switch').textContent = isOutline ? T.toCards : T.toOutline;
  $('view-switch').setAttribute('aria-pressed', String(isOutline));
}
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;currentFilter=b.dataset.filter;render();});
$('view-switch').addEventListener('click',()=>{isOutline=!isOutline;render();});
$('print-btn').addEventListener('click',()=>window.print());
$('outline').addEventListener('click',e=>{
  const b=e.target.closest('.go-card');if(!b)return;
  e.preventDefault();
  currentFilter='*';isOutline=false;render();
  $('note-'+pad(b.dataset.id)).scrollIntoView({behavior:'smooth',block:'start'});
});

};
const X = s => String(s ?? '').replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const measureCtx = document.createElement('canvas').getContext('2d');
const measure = (text, font) => { measureCtx.font = font; return measureCtx.measureText(text).width; };
const NO_LINE_START = /^[，。、；：！？）》」』”’,.;:!?)\]]/;
function wrapText(text, font, maxW) {
  const tokens = String(text).match(/[^\s\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef]+\s*|\s+|[\s\S]/gu) || [];
  const lines = []; let line = '';
  for (const tok of tokens) {
    if (!line || measure(line + tok, font) <= maxW || NO_LINE_START.test(tok)) { line += tok; continue; }
    lines.push(line.trimEnd()); line = tok.trimStart();
  }
  if (line.trim()) lines.push(line.trimEnd());
  return lines;
}
function fitOneLine(text, font, maxW) {
  if (measure(text, font) <= maxW) return text;
  let s = text;
  while (s.length > 1 && measure(s + '…', font) > maxW) s = s.slice(0, -1);
  return s + '…';
}
function cardSVG(n) {
  const cs = getComputedStyle(document.documentElement);
  const c = k => cs.getPropertyValue(k).trim();
  const W = 600, M = 24, P = 32, L = M + P, R = W - M - P, CW = R - L;
  const out = [];
  const txt = (x, y, s, font, fill, extra='') => out.push(`<text x="${x}" y="${y}" fill="${fill}" style="font:${X(font)}" ${extra}>${X(s)}</text>`);
  let y = L + 13;
  // top row: number · book · tag
  const fNum = `600 13px ${FONT.mono}`, fBook = `${LANG==='en'?'italic ':''}400 12px ${FONT.sans}`, fTag = `400 11px ${FONT.sans}`;
  const numText = '#' + pad(n.number);
  txt(L, y, numText, fNum, c('--green'));
  const tagW = measure(n.topic, fTag) + n.topic.length * 1.1 + 16;
  out.push(`<rect x="${R - tagW}" y="${y - 14}" width="${tagW}" height="21" rx="4" fill="none" stroke="${c('--border')}"/>`);
  txt(R - tagW / 2, y + 1, n.topic, fTag, c('--ink-soft'), 'text-anchor="middle" letter-spacing="1.1"');
  const bookX = L + measure(numText, fNum) + 11;
  txt(bookX, y, fitOneLine(T.book(book.title), fBook, R - tagW - 12 - bookX), fBook, c('--gray-text'));
  // title
  const tSize = 26, tLead = Math.round(tSize * 1.42);
  const fTitle = `${LANG==='en'?700:800} ${tSize}px ${FONT.serif}`;
  y += 22;
  for (const part of n.title) for (const ln of wrapText(part, fTitle, CW)) { y += tLead; txt(L, y - 9, ln, fTitle, c('--ink'), LANG==='en' ? '' : 'letter-spacing="-0.9"'); }
  // diagram between two hairlines
  y += 18;
  out.push(`<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke="${c('--border')}"/>`);
  const dH = CW * 228 / 560;
  out.push(`<svg x="${L}" y="${y + 12}" width="${CW}" height="${dH}" viewBox="0 0 560 228" overflow="visible"><g class="dg">${n.diagram_svg}</g></svg>`);
  y += dH + 24;
  out.push(`<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke="${c('--border')}"/>`);
  // quote
  const p = quoteParts(n.quote);
  const fLabel = `700 11px ${FONT.sans}`;
  y += 30;
  txt(L, y, p.label, fLabel, c('--green'), 'letter-spacing="1.6"');
  const labelEnd = L + measure(p.label, fLabel) + p.label.length * 1.6 + 12;
  out.push(`<line x1="${labelEnd}" y1="${y - 4}" x2="${R}" y2="${y - 4}" stroke="${c('--border')}"/>`);
  const fMain = `${LANG==='en'?500:600} 17px ${FONT.serif}`;
  y += 6;
  for (const ln of wrapText(p.main, fMain, CW)) { y += 27; txt(L, y, ln, fMain, c('--ink')); }
  if (p.orig) {
    const fOrig = `italic 400 13px ${FONT.italic}`;
    y += 4;
    for (const ln of wrapText(p.orig, fOrig, CW)) { y += 20; txt(L, y, ln, fOrig, c('--gray-text')); }
  }
  if (n.interpretation_note) {
    const fNote = `400 12px ${FONT.sans}`;
    y += 6;
    for (const ln of wrapText(T.note + n.interpretation_note, fNote, CW)) { y += 19; txt(L, y, ln, fNote, c('--gray-text')); }
  }
  // source line
  const fSrc = `400 11px ${FONT.sans}`;
  y += 34;
  txt(L, y, fitOneLine('SOURCE · ' + n.source.locator, fSrc, CW), fSrc, c('--gray-text'));
  const H = Math.ceil(y + P - 6 + M);
  const style = `.dg text{font-family:${FONT.sans};letter-spacing:.02em}
.dg .tx{fill:${c('--ink-soft')};font-size:14px}.dg .sm{fill:${c('--gray-text')};font-size:12px}
.dg .mid{fill:${c('--ink')};font-size:14px;font-weight:600}.dg .strong{fill:${c('--green')};font-size:14px;font-weight:650}
.dg .tiny{fill:${c('--gray-text')};font-size:11px}.dg .grey-shape{fill:${c('--gray-shape')}}
.dg .grey-stroke{stroke:${c('--gray-line')}}.dg .grey-stroke-strong{stroke:${c('--gray-shape')}}
.dg .green-fill{fill:${c('--green')}}.dg .green-stroke{stroke:${c('--green-2')}}.dg .wash-fill{fill:${c('--wash')}}
.dg .dash{stroke-dasharray:5 7}.dg .you{fill:${c('--ink')}}.dg .you-tx{fill:${c('--card')};font-weight:700;font-size:12px}
.dg use{fill:${c('--green')}}.dg path,.dg line{stroke-linecap:round;stroke-linejoin:round}`;
  const unique = document.getElementById('ng-unique').getAttribute('d');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
<defs><style>${style}</style><path id="ng-unique" d="${unique}"/></defs>
<rect width="${W}" height="${H}" fill="${c('--bg')}"/>
<rect x="${M + .5}" y="${M + .5}" width="${W - 2 * M - 1}" height="${H - 2 * M - 1}" rx="18" fill="${c('--card')}" stroke="${c('--border')}"/>
${out.join('\n')}
</svg>`;
  return { svg, W, H };
}
function fileStem(n) { return `${String(book.title).replace(/[\\/:*?"<>|\s]+/g, '-')}-${pad(n.number)}`; }
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function cardPNG(n, scale = 2) {
  const { svg, W, H } = cardSVG(n);
  const img = new Image();
  await new Promise((ok, fail) => { img.onload = ok; img.onerror = fail; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
  const canvas = document.createElement('canvas');
  canvas.width = W * scale; canvas.height = H * scale;
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return await new Promise((ok, fail) => canvas.toBlob(b => b ? ok(b) : fail(new Error('toBlob')), 'image/png'));
}
$('cards').addEventListener('click', async e => {
  const btn = e.target.closest('[data-save]'); if (!btn) return;
  const n = cardById.get(Number(btn.dataset.save));
  btn.disabled = true; btn.textContent = T.saving;
  try { download(await cardPNG(n), fileStem(n) + '.png'); }
  catch (err) { console.warn(err); alert(T.saveFail); download(new Blob([cardSVG(n).svg], { type: 'image/svg+xml' }), fileStem(n) + '.svg'); }
  finally { btn.disabled = false; btn.textContent = T.save; }
});
window.NoteGlyph = { cardSVG, cardPNG };
render();
</script>
